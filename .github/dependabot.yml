version: 2
updates:
  # Monitoramento de dependências Python (pip)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Recife"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"

  # Monitoramento de dependências Frontend (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Recife"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"

  # Monitoramento de GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Recife"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
